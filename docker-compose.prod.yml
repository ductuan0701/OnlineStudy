services:
  db:
    image: mysql:8.0
    container_name: online-study-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-OnlineStudyRootSecret2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-onlinestudy}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-blue:
    image: ${DOCKER_USERNAME:-boychungtinh}/online-study-backend:latest
    container_name: online-study-backend-blue
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-onlinestudy}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-OnlineStudyRootSecret2026!}
      MOMO_PARTNERCODE: ${MOMO_PARTNER_CODE:-MOMOLRJZ20181206}
      MOMO_ACCESSKEY: ${MOMO_ACCESS_KEY:-mTCKt9W3eU1m39TW}
      MOMO_SECRETKEY: ${MOMO_SECRET_KEY:-SetA5RDnLHvt51AULf51DyauxUo3kDU6}
      SERVER_SERVLET_CONTEXT_PATH: /api
    volumes:
      - uploaded_files:/app/Files-Upload
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend-green:
    image: ${DOCKER_USERNAME:-boychungtinh}/online-study-backend:latest
    container_name: online-study-backend-green
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-onlinestudy}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-OnlineStudyRootSecret2026!}
      MOMO_PARTNERCODE: ${MOMO_PARTNER_CODE:-MOMOLRJZ20181206}
      MOMO_ACCESSKEY: ${MOMO_ACCESS_KEY:-mTCKt9W3eU1m39TW}
      MOMO_SECRETKEY: ${MOMO_SECRET_KEY:-SetA5RDnLHvt51AULf51DyauxUo3kDU6}
      SERVER_SERVLET_CONTEXT_PATH: /api
    volumes:
      - uploaded_files:/app/Files-Upload
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend-blue:
    image: ${DOCKER_USERNAME:-boychungtinh}/online-study-frontend:latest
    container_name: online-study-frontend-blue
    restart: always
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend-green:
    image: ${DOCKER_USERNAME:-boychungtinh}/online-study-frontend:latest
    container_name: online-study-frontend-green
    restart: always
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: online-study-nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - online-study-network

  prometheus:
    image: prom/prometheus:latest
    container_name: online-study-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - online-study-network

  grafana:
    image: grafana/grafana:latest
    container_name: online-study-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - online-study-network

networks:
  online-study-network:
    driver: bridge

volumes:
  mysql_data:
  uploaded_files:
