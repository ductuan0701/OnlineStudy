upstream frontend_service {
    server frontend:80;
}

upstream backend_service {
    server backend:8080;
}

upstream grafana_service {
    server grafana:3000;
}

upstream prometheus_service {
    server prometheus:9090;
}

# 1. Chuyển hướng tự động toàn bộ lưu lượng HTTP (port 80) sang HTTPS (port 443)
server {
    listen 80;
    server_name hoclaptrinh.top www.hoclaptrinh.top api.hoclaptrinh.top admin.hoclaptrinh.top localhost;
    return 301 https://$host$request_uri;
}

# 2. Subdomain Web: hoclaptrinh.top & www.hoclaptrinh.top (Giao diện React SPA Học viên)
server {
    listen 443 ssl http2;
    server_name hoclaptrinh.top www.hoclaptrinh.top localhost;

    # Cấu hình chứng chỉ SSL/TLS
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # Tiêu chuẩn bảo mật TLS hiện đại
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Tối ưu tải file dung lượng lớn
    client_max_body_size 1024M;

    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 3. Subdomain API: api.hoclaptrinh.top (Backend Spring Boot REST API & Uploads)
server {
    listen 443 ssl http2;
    server_name api.hoclaptrinh.top;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 1024M;

    # Trả về thông báo JSON khi truy cập trực tiếp trang chủ API Subdomain (không còn bị 404)
    location = / {
        default_type application/json;
        return 200 '{"status":"SUCCESS","message":"Online Study Spring Boot API Service is running!","version":"1.0.0"}';
    }

    # Hỗ trợ proxy cả những request gọi / và /api/ xuống Backend
    location / {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 4. Subdomain Admin: admin.hoclaptrinh.top (Khu vực Quản trị viên & Giáo viên)
server {
    listen 443 ssl http2;
    server_name admin.hoclaptrinh.top;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 1024M;

    # Khi người dùng truy cập trang chủ của Admin (https://admin.hoclaptrinh.top/), tự động chuyển hướng vào khu vực quản trị
    location = / {
        return 302 https://admin.hoclaptrinh.top/manage-layout;
    }

    # Phục vụ ứng dụng React SPA
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 5. Subdomain Monitor: monitor.hoclaptrinh.top (Hệ thống giám sát Grafana)
server {
    listen 443 ssl http2;
    server_name monitor.hoclaptrinh.top;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cấu hình proxy cho Grafana
    location / {
        proxy_pass http://grafana_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cấu hình proxy cho Prometheus
    location /prometheus/ {
        proxy_pass http://prometheus_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
